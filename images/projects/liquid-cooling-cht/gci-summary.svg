<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="720" viewBox="0 0 1440 720" role="img" aria-labelledby="title description">
  <title id="title">Fine-mesh grid convergence index by turbulence model</title>
  <desc id="description">Three-level GCI study of the 20-channel cold plate. k-omega SST: GCI below 1 percent for pressure drop, 1.2 percent for maximum surface temperature, 1.4 percent for mean hot-spot temperature. k-epsilon with wall functions: 7.7, 7.9 and 16 percent.</desc>
  <g font-family="Arial, Helvetica, sans-serif" fill="#20272E">
    <text x="720" y="70" text-anchor="middle" font-size="31" font-weight="700">MESH CONVERGENCE (GCI, FINE MESH)</text>
    <text x="720" y="108" text-anchor="middle" font-size="23" fill="#52616D">20-channel cold plate · 400 W · OpenFOAM-13 conjugate heat transfer</text>
    <line x1="92" y1="144" x2="1348" y2="144" stroke="#CDD4D9" stroke-width="2"/>
    <text x="92" y="234" font-size="25" font-weight="700">Pressure drop Δp</text>
    <text x="440" y="222" font-size="19" fill="#52616D">k-ω SST</text><rect x="560" y="200" width="40.0" height="32" rx="5" fill="#357F82"/><text x="615.0" y="226" font-size="25" font-weight="700" fill="#276B70">&lt;1%</text>
    <text x="440" y="266" font-size="19" fill="#52616D">k-ε</text><rect x="560" y="244" width="308.0" height="32" rx="5" fill="#AEB8C0"/><text x="883.0" y="270" font-size="25" font-weight="700">7.7%</text>
    <text x="92" y="364" font-size="25" font-weight="700">Max surface temp.</text>
    <text x="440" y="352" font-size="19" fill="#52616D">k-ω SST</text><rect x="560" y="330" width="48.0" height="32" rx="5" fill="#357F82"/><text x="623.0" y="356" font-size="25" font-weight="700" fill="#276B70">1.2%</text>
    <text x="440" y="396" font-size="19" fill="#52616D">k-ε</text><rect x="560" y="374" width="316.0" height="32" rx="5" fill="#AEB8C0"/><text x="891.0" y="400" font-size="25" font-weight="700">7.9%</text>
    <text x="92" y="494" font-size="25" font-weight="700">Mean hot-spot temp.</text>
    <text x="440" y="482" font-size="19" fill="#52616D">k-ω SST</text><rect x="560" y="460" width="56.0" height="32" rx="5" fill="#357F82"/><text x="631.0" y="486" font-size="25" font-weight="700" fill="#276B70">1.4%</text>
    <text x="440" y="526" font-size="19" fill="#52616D">k-ε</text><rect x="560" y="504" width="640" height="32" rx="5" fill="#AEB8C0"/><text x="1215" y="530" font-size="25" font-weight="700">16%</text>
    <line x1="92" y1="627" x2="1348" y2="627" stroke="#CDD4D9" stroke-width="2"/>
    <text x="720" y="670" text-anchor="middle" font-size="22" fill="#52616D">SST is mesh-converged · k-ε with wall functions is not mesh-independent at y⁺ ≈ 2–4</text>
  </g>
</svg>
