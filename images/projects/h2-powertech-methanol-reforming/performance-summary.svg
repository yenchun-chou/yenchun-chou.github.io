<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="720" viewBox="0 0 1440 720" role="img" aria-labelledby="title description">
  <title id="title">Two-inch methanol reformer performance with passive flow disturbers</title>
  <desc id="description">At a plus-forty-degree wall temperature configuration, carbon monoxide decreased from 4.5 to 1.6 percent, and hydrogen production increased from 8.87 to 9.6 kilograms per day. Methanol conversion was 98.35 percent without and 96.31 percent with disturbers.</desc>
  <g font-family="Arial, Helvetica, sans-serif" fill="#20272E">
    <text x="720" y="70" text-anchor="middle" font-size="31" font-weight="700">PASSIVE FLOW DISTURBERS</text>
    <text x="720" y="108" text-anchor="middle" font-size="23" fill="#52616D">2-inch methanol reformer · paired experimental comparison</text>
    <line x1="92" y1="144" x2="1348" y2="144" stroke="#CDD4D9" stroke-width="2"/>
    <g transform="translate(90,170)">
      <text x="0" y="34" font-size="28" font-weight="700">CO concentration</text>
      <text x="0" y="66" font-size="21" fill="#52616D">Lower is better</text>
      <text x="0" y="142" font-size="21" fill="#52616D">Without disturbers</text>
      <rect x="0" y="163" width="520" height="44" rx="6" fill="#AEB8C0"/>
      <text x="535" y="195" font-size="36" font-weight="700">4.5%</text>
      <text x="0" y="265" font-size="21" fill="#52616D">With disturbers</text>
      <rect x="0" y="287" width="185" height="44" rx="6" fill="#357F82"/>
      <text x="200" y="321" font-size="36" font-weight="700" fill="#276B70">1.6%</text>
      <text x="0" y="400" font-size="30" font-weight="700" fill="#276B70">CO reduced by 2.9 points</text>
    </g>
    <line x1="724" y1="176" x2="724" y2="610" stroke="#CDD4D9" stroke-width="2"/>
    <g transform="translate(788,170)">
      <text x="0" y="34" font-size="28" font-weight="700">H₂ production</text>
      <text x="0" y="66" font-size="21" fill="#52616D">kg/day per reactor · higher is better</text>
      <text x="0" y="142" font-size="21" fill="#52616D">Without disturbers</text>
      <rect x="0" y="163" width="430" height="44" rx="6" fill="#AEB8C0"/>
      <text x="445" y="195" font-size="35" font-weight="700">8.87</text>
      <text x="0" y="265" font-size="21" fill="#52616D">With disturbers</text>
      <rect x="0" y="287" width="466" height="44" rx="6" fill="#357F82"/>
      <text x="481" y="320" font-size="35" font-weight="700" fill="#276B70">9.6</text>
      <text x="0" y="400" font-size="30" font-weight="700" fill="#276B70">H₂ output increased</text>
    </g>
    <line x1="92" y1="627" x2="1348" y2="627" stroke="#CDD4D9" stroke-width="2"/>
    <text x="720" y="670" text-anchor="middle" font-size="22" fill="#52616D">Conversion: 98.35% without vs. 96.31% with disturbers · Source: Chou et al. (2025), Table 5</text>
  </g>
</svg>
